[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairino-fr5-teleop-sim"
version = "0.1.0"
description = "Safety-gated Quest 3 teleoperation bridge for FAIRINO FR5 and IH01"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
sim = ["mujoco>=3.2", "numpy>=1.24"]

[project.scripts]
fairino-fr5-teleop-sim = "fairino_fr5_vr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
